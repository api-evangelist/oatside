aid: oatside
name: Oatside
description: >-
  Oatside is a Southeast Asian oat milk brand founded in Singapore in 2020 by Benedict Lim,
  operating as one of Asia's only "full-stack" plant-milk companies — it controls sourcing,
  R&D and manufacturing from its own facility in Java, Indonesia, using Australian oats.
  Its barista-oriented range (Barista Blend, Espresso Roast, Caffe Latte, Chocolate,
  Chocolate Malt, Matcha, Caramel Macchiato) is sold through independent cafes and retail
  across Singapore, Hong Kong, Indonesia, Vietnam, Thailand, Cambodia, the Philippines,
  Malaysia, Taiwan, India, the Middle East and Australia. Oatside is a consumer packaged
  goods company and publishes no developer program, but its direct-to-consumer Shopify
  storefront exposes a live, anonymous, agent-callable commerce surface: a Universal
  Commerce Protocol (UCP) merchant profile and an MCP endpoint serving 13 catalog, cart
  and checkout tools, plus a published agents.md and llms.txt.
