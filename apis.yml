apis:
- name: Oatside SG Storefront UCP / MCP
  description: >-
    The agent-facing commerce surface of Oatside's Singapore direct-to-consumer storefront.
    Implements the Universal Commerce Protocol (UCP) 2026-04-08 over MCP: an anonymous
    tools/list returns 13 tools covering catalog search and lookup, product detail, cart
    create/update/cancel, checkout create/get/update/complete/cancel, and order retrieval.
    The protocol implementation is provided by the Shopify platform and scoped to Oatside's
    own merchant tenant (merchant "Oatside SG", shop_id 57430966333) — Oatside did not
    author the protocol, but the endpoint, catalog, policies and commerce relationship
    are Oatside's and are served from a host Oatside controls.
  humanURL: https://shop.oatside.com/agents.md
  baseURL: https://shop.oatside.com/api/ucp/mcp
