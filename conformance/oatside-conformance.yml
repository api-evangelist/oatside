domain_standard:
  id: ucp
  name: Universal Commerce Protocol
  conforms: true
  version: '2026-04-08'
  supported_versions:
  - '2026-04-08'
  - '2026-01-23'
  declared_in_contract: true
  evidence: >-
    The contract declares the standard for its own market at
    https://shop.oatside.com/.well-known/ucp — a UCP merchant profile whose `ucp.version`
    is 2026-04-08 and whose `services` block registers dev.ucp.shopping with
    transport "mcp", endpoint https://oatside.myshopify.com/api/ucp/mcp and schema
    https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json. The live MCP endpoint
    confirms it at runtime with the response header
    x-shopify-ucp-mcp-api-version: 2026-04-08.
  capabilities_declared:
  - dev.ucp.shopping.checkout
  - dev.ucp.shopping.cart
  - dev.ucp.shopping.order
  - dev.ucp.shopping.fulfillment
  - dev.ucp.shopping.discount
  - dev.ucp.shopping.catalog.search
  - dev.ucp.shopping.catalog.lookup
  payment_handlers_declared:
  - id: com.google.pay
    version: '2026-01-11'
  - id: dev.shopify.card
    version: '2026-01-15'
  - id: dev.shopify.shop_pay
    version: '2026-04-08'
  market_note: >-
    UCP is the emerging agentic-commerce interoperability standard for retail. A merchant
    speaking it can be transacted with by any UCP-capable shopping agent without a bespoke
    connector; a merchant that does not requires a bilateral integration or screen scraping.
  attribution_note: >-
    Conformance is inherited from the Shopify platform, which implements UCP natively for
    its stores. It is real and callable at Oatside's host, but it is a platform capability
    Oatside enabled rather than one Oatside built.
