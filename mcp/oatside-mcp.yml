name: Oatside SG Storefront UCP/MCP Server
status: live
ownership_note: >-
  The MCP server is provided by the Shopify platform (Universal Commerce Protocol native
  support) and is scoped to Oatside's own merchant tenant — the UCP profile names merchant
  "Oatside SG", merchant_origin shop.oatside.com and shop_id 57430966333, and the tools
  operate on Oatside's catalog, carts and orders. Oatside did not author the protocol or
  the server implementation; it enabled it on a host it controls. Recorded as Oatside's
  agent surface, not as Oatside-authored engineering.
