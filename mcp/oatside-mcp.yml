tools_manifest: mcp/oatside-ucp-mcp-tools.json
tool_count: 13
tools:
- name: search_catalog
  category: catalog
  description: Search for products from the online store, hosted on Shopify.
- name: lookup_catalog
  category: catalog
  description: Look up multiple products or variants by identifier.
- name: get_product
  category: catalog
  description: Retrieve complete product detail by identifier. Returns a singular product.
- name: create_cart
  category: cart
  description: Creates a new cart.
- name: get_cart
  category: cart
  description: Get the cart contents.
- name: update_cart
  category: cart
  description: Perform updates to a cart.
- name: cancel_cart
  category: cart
  description: Cancels a cart.
- name: create_checkout
  category: checkout
  description: Creates a checkout. Returns checkout details, line items, totals, discounts and taxes.
- name: get_checkout
  category: checkout
  description: Returns details about the checkout, including line items, totals, discounts and taxes.
- name: update_checkout
  category: checkout
  description: Updates a checkout.
- name: complete_checkout
  category: checkout
  description: Completes a checkout. Returns order ID, Thank You Page URL, or errors. Requires buyer approval.
- name: cancel_checkout
  category: checkout
  description: Cancels a checkout.
- name: get_order
  category: order
  description: Get the details of an order.
notes:
- Every tool inputSchema requires meta.ucp-agent.profile — a URI identifying the calling
  agent. tools/list is anonymous, but tools/call without a resolvable agent profile returns
  JSON-RPC error -32001 / invalid_profile_url.
- Prices are integers in ISO 4217 minor units paired with a currency code.
- The provider's own agents.md forbids unattended payment completion; complete_checkout
  requires contemporaneous human buyer approval.
